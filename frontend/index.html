<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Employee Leave Management System</title>
    <meta name="description"
        content="Streamline your team's leave management with ELMS - Professional, efficient, and easy to use">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .login-container {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: var(--spacing-lg);
            position: relative;
        }

        .login-card {
            width: 100%;
            max-width: 480px;
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Logo Section */
        .logo-section {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }

        .logo-container {
            display: inline-block;
            margin-bottom: var(--spacing-lg);
            position: relative;
            animation: fadeIn 0.8s ease-out;
        }

        .logo-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            box-shadow: 0 8px 32px rgba(139, 92, 246, 0.4);
            transition: transform 0.3s ease;
        }

        .logo-container:hover .logo-image {
            transform: scale(1.05) rotate(5deg);
        }

        .logo-title {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: var(--spacing-xs);
            letter-spacing: -0.5px;
        }

        .logo-subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .logo-tagline {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.875rem;
            margin-top: var(--spacing-xs);
            font-style: italic;
        }

        /* Form Styling */
        .login-form {
            margin-top: var(--spacing-xl);
        }

        .form-group {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.25rem;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
        }

        .form-input-with-icon {
            padding-left: 3rem;
        }

        .password-toggle {
            position: absolute;
            right: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 1.25rem;
            transition: color 0.2s ease;
        }

        .password-toggle:hover {
            color: rgba(255, 255, 255, 0.9);
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: var(--spacing-md);
            margin-bottom: var(--spacing-lg);
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.875rem;
        }

        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .forgot-link {
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .forgot-link:hover {
            color: white;
        }

        .sign-in-btn {
            width: 100%;
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .sign-in-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .sign-in-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        /* Features Section */
        .features {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: var(--spacing-md);
            margin-top: var(--spacing-2xl);
            padding-top: var(--spacing-2xl);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .feature-item {
            text-align: center;
            padding: var(--spacing-md);
            border-radius: var(--radius-md);
            transition: all 0.3s ease;
        }

        .feature-item:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }

        .feature-icon {
            font-size: 1.5rem;
            margin-bottom: var(--spacing-xs);
        }

        .feature-text {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
        }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: var(--spacing-xl);
            padding-top: var(--spacing-lg);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.875rem;
        }

        /* Loading State */
        .btn-loading {
            position: relative;
            color: transparent;
            pointer-events: none;
        }

        .btn-loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            left: 50%;
            margin-left: -10px;
            margin-top: -10px;
            border: 2px solid white;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Responsive */
        @media (max-width: 640px) {
            .logo-title {
                font-size: 2rem;
            }

            .features {
                grid-template-columns: 1fr;
                gap: var(--spacing-sm);
            }

            .login-card {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>
    <!-- Animated Background -->
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="login-container">
        <div class="login-card glass-card">
            <!-- Logo Section -->
            <div class="logo-section">
                <div class="logo-container">
                    <img src="logo.png" alt="ELMS Logo" class="logo-image">
                </div>
                <h1 class="logo-title">ELMS</h1>
                <p class="logo-subtitle">Employee Leave Management System</p>
                <p class="logo-tagline">Streamline your team's time-off management</p>
            </div>

            <!-- Alert Container -->
            <div id="alertContainer"></div>

            <!-- Login Form -->
            <form id="loginForm" class="login-form">
                <div class="form-group">
                    <label for="email" class="form-label">Email Address</label>
                    <div style="position: relative;">
                        <span class="input-icon">📧</span>
                        <input type="email" id="email" class="form-input form-input-with-icon"
                            placeholder="your.email@company.com" autocomplete="email" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div style="position: relative;">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" class="form-input form-input-with-icon"
                            placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            👁️
                        </button>
                    </div>
                </div>

                <div class="remember-forgot">
                    <label class="remember-me">
                        <input type="checkbox" id="rememberMe">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-link">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary sign-in-btn" id="signInBtn">
                    Sign In
                </button>
            </form>

            <!-- Features -->
            <div class="features">
                <div class="feature-item">
                    <div class="feature-icon">⚡</div>
                    <div class="feature-text">Fast & Efficient</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🔐</div>
                    <div class="feature-text">Secure Access</div>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">📊</div>
                    <div class="feature-text">Real-time Tracking</div>
                </div>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                <p>&copy; 2026 ELMS. All rights reserved.</p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Password toggle functionality
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.querySelector('.password-toggle');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = '👁️';
            }
        }

        // Enhanced form handling with loading state
        const loginForm = document.getElementById('loginForm');
        const signInBtn = document.getElementById('signInBtn');

        loginForm.addEventListener('submit', function (e) {
            // Add loading state
            signInBtn.classList.add('btn-loading');
            signInBtn.disabled = true;

            // The auth.js will handle the actual submission
            // This is just for visual feedback
        });

        // Auto-fill animation on page load
        window.addEventListener('load', function () {
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');

            // Add focus effect
            [emailInput, passwordInput].forEach(input => {
                input.addEventListener('focus', function () {
                    this.parentElement.style.transform = 'scale(1.02)';
                    this.parentElement.style.transition = 'transform 0.2s ease';
                });

                input.addEventListener('blur', function () {
                    this.parentElement.style.transform = 'scale(1)';
                });
            });
        });
    </script>
</body>

</html>
