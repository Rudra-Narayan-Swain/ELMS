<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Calendar - Employee Leave Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-xl);
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }

        .calendar-controls {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            flex-wrap: wrap;
        }

        .month-nav {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .month-display {
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
            min-width: 200px;
            text-align: center;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 1px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-lg);
            overflow: hidden;
            margin-bottom: var(--spacing-xl);
        }

        .calendar-header {
            background: rgba(255, 255, 255, 0.2);
            padding: var(--spacing-md);
            text-align: center;
            font-weight: 700;
            color: white;
            font-size: 0.875rem;
            text-transform: uppercase;
        }

        .calendar-day {
            background: rgba(255, 255, 255, 0.05);
            padding: var(--spacing-sm);
            min-height: 100px;
            position: relative;
            transition: all var(--transition-fast);
        }

        .calendar-day:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .calendar-day.other-month {
            opacity: 0.3;
        }

        .calendar-day.today {
            background: rgba(99, 102, 241, 0.3);
            border: 2px solid var(--primary-light);
        }

        .day-number {
            font-weight: 600;
            color: white;
            margin-bottom: var(--spacing-xs);
        }

        .day-events {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .event-item {
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: var(--radius-sm);
            color: white;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .event-item:hover {
            opacity: 0.8;
            transform: scale(1.02);
        }

        .legend {
            display: flex;
            gap: var(--spacing-lg);
            flex-wrap: wrap;
            padding: var(--spacing-lg);
            background: rgba(255, 255, 255, 0.05);
            border-radius: var(--radius-md);
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.875rem;
        }

        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: var(--radius-sm);
        }

        @media (max-width: 768px) {
            .calendar-grid {
                gap: 0;
            }

            .calendar-day {
                min-height: 80px;
                padding: 4px;
            }

            .day-number {
                font-size: 0.875rem;
            }

            .event-item {
                font-size: 0.625rem;
                padding: 1px 4px;
            }
        }
    </style>
</head>

<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container">
        <div class="header">
            <h1>📅 Leave Calendar</h1>
            <div>
                <button onclick="window.location.href='dashboard.html'" class="btn btn-secondary">
                    ← Back to Dashboard
                </button>
            </div>
        </div>

        <div class="calendar-controls">
            <div class="month-nav">
                <button onclick="previousMonth()" class="btn btn-secondary">←</button>
                <div class="month-display" id="monthDisplay"></div>
                <button onclick="nextMonth()" class="btn btn-secondary">→</button>
            </div>
            <button onclick="goToToday()" class="btn btn-primary">Today</button>
        </div>

        <div style="margin: var(--spacing-xl) 0;">
            <div class="calendar-grid">
                <div class="calendar-header">Sun</div>
                <div class="calendar-header">Mon</div>
                <div class="calendar-header">Tue</div>
                <div class="calendar-header">Wed</div>
                <div class="calendar-header">Thu</div>
                <div class="calendar-header">Fri</div>
                <div class="calendar-header">Sat</div>
                <div id="calendarDays"></div>
            </div>
        </div>

        <div class="legend" id="legend">
            <div class="legend-item">
                <div class="legend-color" style="background: var(--primary);"></div>
                <span>Today</span>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/calendar.js"></script>
</body>

</html>
