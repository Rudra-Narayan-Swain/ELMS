<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Employee Leave Management System</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-xl);
            flex-wrap: wrap;
            gap: var(--spacing-md);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
        }

        .balance-grid {
            margin-bottom: var(--spacing-2xl);
        }

        .balance-card {
            text-align: center;
            padding: var(--spacing-lg);
        }

        .balance-number {
            font-size: 2.5rem;
            font-weight: 700;
            color: white;
            margin: var(--spacing-sm) 0;
        }

        .balance-label {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.8);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .balance-type {
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.9);
            margin-top: var(--spacing-xs);
        }

        .action-buttons {
            display: flex;
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-2xl);
            flex-wrap: wrap;
        }

        .section-title {
            margin-bottom: var(--spacing-lg);
            padding-bottom: var(--spacing-sm);
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
        }

        .empty-state {
            text-align: center;
            padding: var(--spacing-2xl);
            color: rgba(255, 255, 255, 0.7);
        }

        .empty-state p {
            font-size: 1.125rem;
        }

        .table-actions {
            display: flex;
            gap: var(--spacing-xs);
        }

        .btn-sm {
            padding: 0.375rem 0.75rem;
            font-size: 0.875rem;
        }
    </style>
</head>

<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container">
        <div class="header">
            <div>
                <h1 id="welcomeMessage">Welcome!</h1>
                <p id="userRole"></p>
            </div>
            <div class="user-info">
                <button id="adminPanelBtn" class="btn btn-primary hidden" onclick="window.location.href='admin.html'">
                    🔧 Admin Panel
                </button>
                <button onclick="window.location.href='calendar.html'" class="btn btn-secondary">
                    📅 Calendar
                </button>
                <button onclick="api.logout()" class="btn btn-secondary">
                    🚪 Logout
                </button>
            </div>
        </div>

        <div id="alertContainer"></div>

        <!-- Leave Balance Cards -->
        <div id="balanceSection">
            <h3 class="section-title">Your Leave Balance</h3>
            <div id="balanceGrid" class="grid grid-3 balance-grid"></div>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button onclick="openLeaveRequestModal()" class="btn btn-primary">
                ➕ Request Leave
            </button>
        </div>

        <!-- Manager Section (Only for managers) -->
        <div id="managerSection" class="hidden">
            <h3 class="section-title">Pending Leave Requests</h3>
            <div class="table-container">
                <table class="table" id="pendingRequestsTable">
                    <thead>
                        <tr>
                            <th>Employee</th>
                            <th>Leave Type</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Days</th>
                            <th>Reason</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="pendingRequestsBody"></tbody>
                </table>
            </div>
        </div>

        <!-- My Leave Requests -->
        <div style="margin-top: var(--spacing-2xl);">
            <h3 class="section-title">My Leave Requests</h3>
            <div class="table-container">
                <table class="table" id="myRequestsTable">
                    <thead>
                        <tr>
                            <th>Leave Type</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Days</th>
                            <th>Status</th>
                            <th>Reviewed By</th>
                            <th>Comments</th>
                        </tr>
                    </thead>
                    <tbody id="myRequestsBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Leave Request Modal -->
    <div id="leaveRequestModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeLeaveRequestModal()">×</button>
            <h2>Request Leave</h2>

            <form id="leaveRequestForm">
                <div class="form-group">
                    <label for="leaveType" class="form-label">Leave Type</label>
                    <select id="leaveType" class="form-select" required>
                        <option value="">Select leave type...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="startDate" class="form-label">Start Date</label>
                    <input type="date" id="startDate" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="endDate" class="form-label">End Date</label>
                    <input type="date" id="endDate" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="reason" class="form-label">Reason (Optional)</label>
                    <textarea id="reason" class="form-textarea"
                        placeholder="Describe the reason for your leave..."></textarea>
                </div>

                <div style="display: flex; gap: var(--spacing-md);">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Submit Request</button>
                    <button type="button" onclick="closeLeaveRequestModal()" class="btn btn-secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Approval Modal -->
    <div id="approvalModal" class="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="closeApprovalModal()">×</button>
            <h2 id="approvalTitle">Approve Leave Request</h2>

            <form id="approvalForm">
                <input type="hidden" id="approvalRequestId">
                <input type="hidden" id="approvalAction">

                <div class="form-group">
                    <label for="approvalComment" class="form-label">Comment (Optional)</label>
                    <textarea id="approvalComment" class="form-textarea" placeholder="Add a comment..."></textarea>
                </div>

                <div style="display: flex; gap: var(--spacing-md);">
                    <button type="submit" class="btn btn-primary" style="flex: 1;"
                        id="approvalSubmitBtn">Confirm</button>
                    <button type="button" onclick="closeApprovalModal()" class="btn btn-secondary">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
</body>

</html>
